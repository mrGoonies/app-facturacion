databases:
  - name: app-facturacion-db
    databaseName: app_facturacion
    plan: free # bump before real use — free Postgres on Render expires after 90 days

services:
  - type: web
    name: app-facturacion
    runtime: python
    buildCommand: >-
      pip install uv &&
      uv sync --frozen &&
      uv run python manage.py collectstatic --noinput &&
      uv run python manage.py migrate
    startCommand: uv run gunicorn config.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: app-facturacion-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      # Everything below has no safe default — set these in the Render
      # dashboard (Environment tab) rather than committing real values here.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: DJANGO_EMAIL_BACKEND
        value: anymail.backends.mandrill.EmailBackend
      - key: MAILCHIMP_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
