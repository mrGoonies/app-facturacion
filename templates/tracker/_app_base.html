{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="app-shell">
  <aside class="app-sidebar">
    <img class="brandmark" src="{% static 'tracker/img/irritec-logo.png' %}" alt="Irritec" style="margin:2px 0 0 6px">
    <nav style="display:flex;flex-direction:column;gap:2px">
      <a class="nvi" href="{% url 'tracker:queue' %}" {% if active_nav == 'queue' %}aria-current="page"{% endif %}>Cola</a>
      <a class="nvi" href="{% url 'tracker:queue' %}?view=purchases" {% if active_nav == 'purchasing' %}aria-current="page"{% endif %}>Compras</a>
      <a class="nvi" href="{% url 'tracker:queue' %}?view=invoicing" {% if active_nav == 'invoicing' %}aria-current="page"{% endif %}>Facturación</a>
      <a class="nvi" href="{% url 'tracker:kpi_scorecard' %}" {% if active_nav == 'kpi' %}aria-current="page"{% endif %}>Mis KPIs</a>
    </nav>
    <div style="margin-top:auto;display:flex;align-items:center;gap:8px;padding-left:4px">
      <div style="width:30px;height:30px;border-radius:999px;background:var(--color-accent-300);display:grid;place-items:center;font-size:12px;font-weight:700">
        {{ request.user.get_username|slice:":2"|upper }}
      </div>
      <div style="line-height:1.2">
        <div style="font-size:13px">{{ request.user.get_full_name|default:request.user.get_username }}</div>
        <div class="text-muted" style="font-size:11px">Asistente ·
          <form method="post" action="{% url 'tracker:logout' %}" style="display:inline">{% csrf_token %}
            <button type="submit" class="text-muted" style="background:none;border:none;padding:0;font:inherit;text-decoration:underline;cursor:pointer">Cerrar sesión</button>
          </form>
        </div>
      </div>
    </div>
  </aside>
  <div class="app-main">
    {% block app_content %}{% endblock %}
  </div>
</div>
{% endblock %}
